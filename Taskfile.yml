version: "3"

# Releases are local and explicit: `task release:check`, `task release:prepare`,
# `task release`, `task release:resume`. CI never builds or publishes releases.
# See CONTRIBUTING.md ("Releasing").

vars:
  RELTOOL_TAG: v0.2.0
  RELTOOL_COMMIT: 6036a85828711fbfb908f67e159482597c4434c0 # commit of RELTOOL_TAG
  RELTOOL_SRC: ../release-tools
  RELTOOL:
    sh: echo "${XDG_CACHE_HOME:-$HOME/.cache}/release-tools/{{.RELTOOL_COMMIT}}/reltool"

tasks:
  # --- app-owned recipes ---
  check:
    desc: Vet and run the unit tests
    cmds:
      - go vet ./...
      # Unix socket paths are limited to about 100 bytes; the release work
      # directory is too deep for the API tests, so use a short temp dir.
      - |
        set -eu
        short=$(mktemp -d /tmp/pawproxy-check.XXXXXX)
        trap 'rm -rf "$short"' EXIT
        TMPDIR="$short" go test -race ./...

  macos:test:
    desc: Run the menu-bar app's Swift tests, including the live socket test against the Go fixture
    dir: macos
    env:
      PAWPROXY_TEST_DAEMON: "1"
    cmds:
      - swift test

  macos:package-test:
    desc: Test package-app.sh, validate-bundle.sh and dev builds (ad-hoc signed, temp dirs)
    cmds:
      - sh macos/Scripts/test-package-app.sh

  macos:dev:
    desc: Build and launch 'Paw Proxy Dev.app' (no LaunchAgents; never registers services)
    cmds:
      - sh macos/Scripts/dev-app.sh --run

  macos:package:
    desc: "Build a local Paw Proxy.app candidate (APP_VERSION, BUILD_NUMBER, optional SIGNING_IDENTITY)"
    cmds:
      - sh macos/Scripts/package-app.sh "{{.DEST | default "macos/.build/release-candidate/Paw Proxy.app"}}"

  vulncheck:
    desc: Scan dependencies for known vulnerabilities (needs network)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Builds one binary into $RELEASE_OUT.
  # Usage: bin GOOS GOARCH CGO CMD DEST
  bin:
    internal: true
    vars:
      LDFLAGS: -s -w -X main.version=$RELEASE_VERSION -X github.com/alexcatdad/paw-proxy/internal/api.Version=$RELEASE_VERSION
    cmds:
      - >-
        CGO_ENABLED={{.CGO}} GOOS={{.GOOS}} GOARCH={{.GOARCH}}
        go build -ldflags "{{.LDFLAGS}}" -o "$RELEASE_OUT/{{.DEST}}" ./cmd/{{.CMD}}
      - go version -m "$RELEASE_OUT/{{.DEST}}" | grep -q -- "main.version=$RELEASE_VERSION"

  # Signed Paw Proxy.app, zipped. reltool passes MACOS_SIGNING_IDENTITY to
  # this task only; it then notarizes and staples the zip.
  build:darwin-arm64:
    cmds:
      - |
        set -eu
        : "${MACOS_SIGNING_IDENTITY:?release builds of Paw Proxy.app must be signed}"
        APP_VERSION="$RELEASE_VERSION" SIGNING_IDENTITY="$MACOS_SIGNING_IDENTITY" \
          sh macos/Scripts/package-app.sh "$TMPDIR/Paw Proxy.app"
        ditto -c -k --keepParent "$TMPDIR/Paw Proxy.app" "$RELEASE_OUT/Paw-Proxy.app.zip"

  build:linux-amd64:
    cmds:
      - task: bin
        vars: { GOOS: linux, GOARCH: amd64, CGO: "0", CMD: paw-proxy, DEST: "paw-proxy-linux-amd64" }
      - task: bin
        vars: { GOOS: linux, GOARCH: amd64, CGO: "0", CMD: up, DEST: "up-linux-amd64" }
      - tar -czf "$RELEASE_OUT/man-pages.tar.gz" -C man paw-proxy.1 up.1

  build:linux-arm64:
    cmds:
      - task: bin
        vars: { GOOS: linux, GOARCH: arm64, CGO: "0", CMD: paw-proxy, DEST: "paw-proxy-linux-arm64" }
      - task: bin
        vars: { GOOS: linux, GOARCH: arm64, CGO: "0", CMD: up, DEST: "up-linux-arm64" }

  # Unpacks the zip and checks the bundle the way users receive it.
  validate:darwin-arm64:
    cmds:
      - |
        set -eu
        d=$(mktemp -d "$TMPDIR/validate.XXXXXX")
        ditto -x -k "$RELEASE_OUT/Paw-Proxy.app.zip" "$d"
        app="$d/Paw Proxy.app"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$RELEASE_VERSION"
        sh macos/Scripts/validate-bundle.sh "$app"
        codesign --verify --deep --strict "$app"

  # --- release-tools consumer snippet ---
  reltool:install:
    internal: true
    status:
      - test -x "{{.RELTOOL}}"
    cmds:
      - git -C "{{.RELTOOL_SRC}}" show "{{.RELTOOL_COMMIT}}:scripts/install-reltool.sh" | sh -s -- "{{.RELTOOL_SRC}}" "{{.RELTOOL_TAG}}" "{{.RELTOOL_COMMIT}}"

  release:check:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release check --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:prepare:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release prepare --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release run --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:resume:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release resume --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:abandon:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release abandon {{.CLI_ARGS}}'
