version: "3"

# Releases are local and explicit: `task release:check`, `task release:prepare`,
# `task release`, `task release:resume`. CI never builds or publishes releases.
# See CONTRIBUTING.md ("Releasing").

vars:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  RELTOOL_TAG: v0.4.1
  RELTOOL_COMMIT: e5dbed8034b899e5a7091ef1d3edf8e8da7989ab # commit of RELTOOL_TAG
  # release-tools checkout; set RELTOOL_SRC in the environment to override.
  RELTOOL_SRC: '{{.RELTOOL_SRC | default "../../../infrastructure/release-tools"}}'
  RELTOOL:
    sh: echo "${XDG_CACHE_HOME:-$HOME/.cache}/release-tools/{{.RELTOOL_COMMIT}}/reltool"

tasks:
  # --- app-owned recipes ---
  # CI (alexcatdad/ci-actions validate-pr/validate-main) runs lint, build,
  # test and security; `task check` runs the same set locally.
  check:
    desc: Full local gate (lint, build, test, security) - the same tasks CI runs
    cmds:
      - task: lint
      - task: build
      - task: test
      - task: security

  lint:
    desc: gofmt, go vet, golangci-lint and swift-format (strict)
    cmds:
      - test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; echo "run gofmt -w on the files above" >&2; exit 1; }
      - go vet ./...
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run ./...
      - swift format lint --strict --recursive macos/Package.swift macos/Sources macos/Tests

  format:
    desc: Rewrite Go and Swift sources with gofmt and swift-format
    cmds:
      - gofmt -w cmd internal
      - swift format format --in-place --recursive macos/Package.swift macos/Sources macos/Tests

  build:
    desc: Build both Go binaries and the menu-bar app's Swift package
    cmds:
      - go build -o /dev/null ./cmd/paw-proxy
      - go build -o /dev/null ./cmd/up
      - swift build --package-path macos -Xswiftc -warnings-as-errors

  test:
    desc: Go race tests and Swift tests with coverage floors, and package-script tests
    cmds:
      # Unix socket paths are limited to about 100 bytes; the release work
      # directory is too deep for the API tests, so use a short temp dir.
      - |
        set -eu
        short=$(mktemp -d /tmp/pawproxy-check.XXXXXX)
        trap 'rm -rf "$short"' EXIT
        TMPDIR="$short" go test -race ./cmd/...
      # internal/ race tests and the Swift tests run inside the coverage gates.
      - task: coverage
      - task: macos:package-test

  coverage:
    desc: Coverage gates - Go internal/ (scripts/coverage-go.sh) and PawProxyNative (scripts/coverage-swift.sh)
    cmds:
      - sh scripts/coverage-go.sh
      - sh scripts/coverage-swift.sh

  security:
    desc: Scan Go dependencies for known vulnerabilities (needs network)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  macos:test:
    desc: Run the menu-bar app's Swift tests, including the live socket test against the Go fixture
    dir: macos
    env:
      PAWPROXY_TEST_DAEMON: "1"
    cmds:
      - swift test -Xswiftc -warnings-as-errors

  screenshots:
    desc: Render the website's panel and Settings screenshots from fixture data into docs/screenshots/
    cmds:
      - PAWPROXY_SCREENSHOTS="{{.ROOT_DIR}}/docs/screenshots" swift test --package-path macos --filter writesWebsiteScreenshotsWhenAsked

  macos:package-test:
    desc: Test package-app.sh, validate-bundle.sh and dev builds (ad-hoc signed, temp dirs)
    cmds:
      - sh macos/Scripts/test-package-app.sh

  macos:dev:
    desc: Build and launch 'Paw Proxy Dev.app' (no LaunchAgents; never registers services)
    cmds:
      - sh macos/Scripts/dev-app.sh --run

  macos:package:
    desc: "Build a local Paw Proxy.app candidate (APP_VERSION, BUILD_NUMBER, optional SIGNING_IDENTITY)"
    cmds:
      - sh macos/Scripts/package-app.sh "{{.DEST | default "macos/.build/release-candidate/Paw Proxy.app"}}"

  # Signed Paw Proxy.app, zipped. reltool passes MACOS_SIGNING_IDENTITY to
  # this task only; it then notarizes and staples the zip. Apple versions take
  # three integers, so the bundle and its helpers carry MACOS_SHORT_VERSION and
  # MACOS_BUNDLE_VERSION (2026.1105.1 for v2026.11.05.1); one string each keeps
  # the update check exact and CFBundleVersion increasing.
  build:darwin-arm64:
    cmds:
      - |
        set -eu
        : "${MACOS_SIGNING_IDENTITY:?release builds of Paw Proxy.app must be signed}"
        APP_VERSION="$MACOS_SHORT_VERSION" BUILD_NUMBER="$MACOS_BUNDLE_VERSION" SIGNING_IDENTITY="$MACOS_SIGNING_IDENTITY" \
          sh macos/Scripts/package-app.sh "$TMPDIR/Paw Proxy.app"
        ditto -c -k --keepParent "$TMPDIR/Paw Proxy.app" "$RELEASE_OUT/Paw-Proxy.app.zip"

  # Unpacks the zip and checks the bundle the way users receive it.
  validate:darwin-arm64:
    cmds:
      - |
        set -eu
        d=$(mktemp -d "$TMPDIR/validate.XXXXXX")
        ditto -x -k "$RELEASE_OUT/Paw-Proxy.app.zip" "$d"
        app="$d/Paw Proxy.app"
        plist="$app/Contents/Info.plist"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$MACOS_SHORT_VERSION"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$MACOS_BUNDLE_VERSION"
        sh macos/Scripts/validate-bundle.sh "$app"
        codesign --verify --deep --strict "$app"
        # The app and both helpers: Developer ID (our team), hardened runtime,
        # secure timestamp.
        for code in "$app" "$app/Contents/Helpers/paw-proxy" "$app/Contents/Helpers/up"; do
          codesign --verify --strict \
            --test-requirement '=anchor apple generic and certificate leaf[subject.OU] = "CX6D6KGCT5"' "$code"
          sig=$(codesign --display --verbose=4 "$code" 2>&1)
          printf '%s\n' "$sig" | grep -q '^Authority=Developer ID Application:' || { echo "not Developer ID signed: $code" >&2; exit 1; }
          printf '%s\n' "$sig" | grep -q 'flags=.*(runtime)' || { echo "no hardened runtime: $code" >&2; exit 1; }
          printf '%s\n' "$sig" | grep -q '^Timestamp=' || { echo "no secure timestamp: $code" >&2; exit 1; }
        done

  # --- release-tools consumer snippet ---
  reltool:install:
    internal: true
    status:
      - test -x "{{.RELTOOL}}"
    cmds:
      - |
        git -C "{{.RELTOOL_SRC}}" rev-parse --git-dir >/dev/null 2>&1 || {
          echo "release-tools: no git checkout at '{{.RELTOOL_SRC}}'." >&2
          echo "Clone alexcatdad/release-tools there, or set RELTOOL_SRC to your checkout." >&2
          exit 1
        }
      - git -C "{{.RELTOOL_SRC}}" show "{{.RELTOOL_COMMIT}}:scripts/install-reltool.sh" | sh -s -- "{{.RELTOOL_SRC}}" "{{.RELTOOL_TAG}}" "{{.RELTOOL_COMMIT}}"

  release:check:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release check --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:prepare:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release prepare --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release run --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:resume:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release resume --task-exe "{{.TASK_EXE}}" {{.CLI_ARGS}}'

  release:abandon:
    deps: [reltool:install]
    cmds:
      - '"{{.RELTOOL}}" release abandon {{.CLI_ARGS}}'
